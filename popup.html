<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFocus</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>StudyFocus</h1>
        <p class="subtitle">Stay focused. Avoid distractions.</p>

        <!-- Shown ONLY when the user is not logged in -->
        <div id="auth-prompt" class="auth-prompt">

            <p class="auth-message">
                Log in to sync your blocked sites across devices.
            </p>

            <button id="login-button">
                Login / Register
            </button>

        </div>


        <!-- Shown ONLY when the user is logged in -->
        <div id="app-content" class="app-content hidden">

            <!-- User Bar -->
            <div class="user-bar">

                <span id="user-email"></span>

                <button id="logout-button">
                    Logout
                </button>

            </div>


            <!-- Study Mode -->
            <div class="mode-card">

                <div>

                    <h2>Study Mode</h2>

                    <p id="mode-status">
                        Currently OFF
                    </p>

                </div>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="study-mode"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Focus Session -->
            <div class="focus-card">

                <h2>Focus Session</h2>

                <div id="timer">
                    25:00
                </div>


                <!-- Session Duration -->
                <div class="duration-buttons">

                    <button
                        class="duration-btn active"
                        data-duration="25"
                    >
                        25 min
                    </button>

                    <button
                        class="duration-btn"
                        data-duration="45"
                    >
                        45 min
                    </button>

                    <button
                        class="duration-btn"
                        data-duration="60"
                    >
                        60 min
                    </button>

                </div>


                <!-- Start Session -->
                <button id="start-session">
                    Start Session
                </button>

            </div>


            <!-- Stats -->
            <div class="stats">

                <div class="stat-box">

                    <span id="blocked-count">
                        0
                    </span>

                    <p>
                        Blocked Sites
                    </p>

                </div>


                <div class="stat-box">

                    <span id="session-status">
                        Inactive
                    </span>

                    <p>
                        Session
                    </p>

                </div>

            </div>


            <!-- Blocked Websites -->
            <div class="section">

                <h3>
                    Blocked Websites
                </h3>


                <div class="website-input">

                    <input
                        type="text"
                        id="website-input"
                        placeholder="example.com"
                    >

                    <button id="add-website">
                        Add
                    </button>

                </div>


                <ul id="website-list">
                    <!-- Websites will be added here using JavaScript -->
                </ul>

            </div>

        </div>

    </div>

    <!-- NEW: config.js must load before popup.js — it defines
         API_BASE_URL and the apiFetch() helper that popup.js uses -->
    <script src="config.js"></script>
    <script src="popup.js"></script>

</body>
</html>
