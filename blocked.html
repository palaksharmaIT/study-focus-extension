<!DOCTYPE html>
<html lang="en">

<head>

    <title>StudyFocus | Website Blocked</title>

    <link rel="stylesheet" href="blocked.css">
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="icon-wrapper">
                <span class="icon">🔒</span>
            </div>

            <span class="badge">
                STUDY MODE ACTIVE
            </span>

            <h1>
                Website Blocked
            </h1>

            <p class="main-message">
                This website is currently unavailable.
            </p>

            <p class="sub-message">
                Study Mode is active and this website has been blocked
                to help you stay focused.
            </p>

            <div class="status">
                <span class="status-dot"></span>
                <span>Distraction blocked</span>
            </div>

            <button id="back-button" type="button">
                ← Back to previous page
            </button>

            <p class="footer-text">
                Protected by <strong>StudyFocus</strong>
            </p>

        </section>

    </main>

    <script src="blocked.js"></script>

</html>
